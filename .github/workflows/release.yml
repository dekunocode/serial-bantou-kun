name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet run --project Serial_TCP-IP_Monitor_Avalonia.Tests\Serial_TCP-IP_Monitor_Avalonia.Tests.csproj --configuration Release

      - name: Publish (ReadyToRun + compressed single file)
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish Serial_TCP-IP_Monitor_Avalonia\Serial_TCP-IP_Monitor_Avalonia.csproj `
            --configuration Release --runtime win-x64 `
            -p:PublishReadyToRun=true -p:EnableCompressionInSingleFile=true `
            -p:Version=$version `
            --output publish

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $exe = 'publish\SerialBantouKun.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notesFile = ".github\release-notes\$tag.md"
          $notes = if (Test-Path $notesFile) { Get-Content $notesFile -Raw -Encoding utf8 } else { '' }
          $notes += "`n`nSHA-256: ``$hash``"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $tag $exe --draft --title "シリアル番頭くん $tag" --notes-file release-notes.md
